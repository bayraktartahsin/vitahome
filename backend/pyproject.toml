[project]
name = "vitahome"
version = "0.1.0"
description = "VitaHome — an agent fleet that executes medical instructions"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Tahsin Bayraktar", email = "info@gravitilabs.com" }]

dependencies = [
    "google-adk>=2.0.0",
    "google-genai>=2.0.0",
    "google-cloud-firestore>=2.18.0",
    "google-cloud-pubsub>=2.23.0",
    "google-cloud-tasks>=2.16.0",
    "google-cloud-secret-manager>=2.20.0",
    "google-auth>=2.35.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sse-starlette>=2.1.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
    "python-multipart>=0.0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "ruff>=0.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
target-version = "py312"
