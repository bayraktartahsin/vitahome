<text x="593.0" y="570.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#98A2B0">sends</text>
<rect x="826.5" y="512.0" width="236.5" height="78.0" rx="9" fill="#1B222B" stroke="#2A323D" stroke-width="1" />
<path d="M835.5 512.5 H1054.0" stroke="#D4685A" stroke-width="2.5" stroke-linecap="round"/>
<text x="842.5" y="538.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#E8EAED" font-weight="600">Watchman</text>
<text x="842.5" y="554.0" font-family="Menlo, Consolas, monospace" font-size="12" fill="#6C7684">"watchman"</text>
<text x="842.5" y="570.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#98A2B0">watches</text>
<rect x="1076.0" y="512.0" width="236.5" height="78.0" rx="9" fill="#1B222B" stroke="#2A323D" stroke-width="1" />
<path d="M1085.0 512.5 H1303.5" stroke="#6FA3DB" stroke-width="2.5" stroke-linecap="round"/>
<text x="1092.0" y="538.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#E8EAED" font-weight="600">Coach</text>
<text x="1092.0" y="554.0" font-family="Menlo, Consolas, monospace" font-size="12" fill="#6C7684">"coach"</text>
<text x="1092.0" y="570.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#98A2B0">checks in</text>
<rect x="1325.5" y="512.0" width="236.5" height="78.0" rx="9" fill="#1B222B" stroke="#2A323D" stroke-width="1" />
<path d="M1334.5 512.5 H1553.0" stroke="#9B87D4" stroke-width="2.5" stroke-linecap="round"/>
<text x="1341.5" y="538.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#E8EAED" font-weight="600">Escalator</text>
<text x="1341.5" y="554.0" font-family="Menlo, Consolas, monospace" font-size="12" fill="#6C7684">"escalator"</text>
<text x="1341.5" y="570.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#98A2B0">calls a human</text>
<text x="78.0" y="616.0" font-family="Menlo, Consolas, monospace" font-size="12" fill="#6C7684">Every agent on this bus can REFUSE — return the decision to a clinician instead of guessing. The Escalator is</text>
<text x="78.0" y="635.0" font-family="Menlo, Consolas, monospace" font-size="12" fill="#6C7684">human-terminated: no agent can close what it opens. Moving an agent off this service is a push-endpoint change,</text>
<text x="78.0" y="654.0" font-family="Menlo, Consolas, monospace" font-size="12" fill="#6C7684">not a refactor — the Scheduler already runs on its own Cloud Run service, and nothing else changed. Messages</text>
<text x="78.0" y="673.0" font-family="Menlo, Consolas, monospace" font-size="12" fill="#6C7684">carry a patient reference and a task id, never clinical content; each agent reads under its own IAM scope.</text>
<path d="M78 706.0 H1562.0" stroke="#2A323D" stroke-width="1"/>
<text x="78.0" y="730.0" font-family="Menlo, Consolas, monospace" font-size="11" fill="#6C7684" letter-spacing="2.2">GOOGLE CLOUD SERVICES THIS RUNS ON</text>
<rect x="78.0" y="746.0" width="286.4" height="62.0" rx="9" fill="#1B222B" stroke="#2A323D" stroke-width="1" />
<text x="94.0" y="772.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#E8EAED" font-weight="600">Cloud Run</text>
<text x="94.0" y="788.0" font-family="Menlo, Consolas, monospace" font-size="12" fill="#6C7684">3 services · scale to zero</text>
<rect x="377.4" y="746.0" width="286.4" height="62.0" rx="9" fill="#1B222B" stroke="#2A323D" stroke-width="1" />
<text x="393.4" y="772.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#E8EAED" font-weight="600">Cloud Healthcare API</text>
<text x="393.4" y="788.0" font-family="Menlo, Consolas, monospace" font-size="12" fill="#6C7684">FHIR R4 · real writes</text>
<rect x="676.8" y="746.0" width="286.4" height="62.0" rx="9" fill="#1B222B" stroke="#2A323D" stroke-width="1" />
<text x="692.8" y="772.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#E8EAED" font-weight="600">Firestore</text>
<text x="692.8" y="788.0" font-family="Menlo, Consolas, monospace" font-size="12" fill="#6C7684">task ledger · append-only audit</text>
<rect x="976.2" y="746.0" width="286.4" height="62.0" rx="9" fill="#1B222B" stroke="#2A323D" stroke-width="1" />
<text x="992.2" y="772.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#E8EAED" font-weight="600">Google Calendar API</text>
<text x="992.2" y="788.0" font-family="Menlo, Consolas, monospace" font-size="12" fill="#6C7684">events on a real phone</text>
<rect x="1275.6" y="746.0" width="286.4" height="62.0" rx="9" fill="#1B222B" stroke="#2A323D" stroke-width="1" />
<text x="1291.6" y="772.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#E8EAED" font-weight="600">Cloud Scheduler</text>
<text x="1291.6" y="788.0" font-family="Menlo, Consolas, monospace" font-size="12" fill="#6C7684">supervisor sweep · 5 min</text>
<rect x="48" y="864" width="1544" height="458" rx="14" fill="#161B22" stroke="#2A323D" stroke-width="1"/>
<text x="78.0" y="902.0" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#E8EAED" font-weight="600">How a task survives its worker dying</text>
<text x="78.0" y="930.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#98A2B0">This is the part that matters. Nothing catches the kill — recovery is Pub/Sub redelivery plus a ledger</text>
<text x="78.0" y="949.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#98A2B0">that skips the steps already finished.</text>
<text x="78.0" y="990.0" font-family="Menlo, Consolas, monospace" font-size="12" fill="#98A2B0" font-weight="600">attempt 1</text>
<text x="78.0" y="1008.0" font-family="Menlo, Consolas, monospace" font-size="12" fill="#6C7684">worker nrl-dcc9a0</text>
<rect x="278.0" y="974.0" width="210.5" height="40.0" rx="8" fill="#12271D" stroke="#BFE6D0" stroke-width="1" />
<text x="293.0" y="999.0" font-family="Menlo, Consolas, monospace" font-size="12" fill="#BFE6D0">1  resolve_provider  done</text>
<rect x="500.5" y="974.0" width="289.9" height="40.0" rx="8" fill="#2A1512" stroke="#F0B3A9" stroke-width="1" />
<text x="515.5" y="999.0" font-family="Menlo, Consolas, monospace" font-size="12" fill="#F0B3A9">2  fhir_appointment  killed mid-step</text>
<rect x="78.0" y="1032.0" width="1484.0" height="54.0" rx="9" fill="#2A1512" stroke="#7A3329" stroke-width="1" />
<text x="94.0" y="1053.0" font-family="Menlo, Consolas, monospace" font-size="12" fill="#F0B3A9">os._exit(1) — no cleanup, no graceful shutdown, the message is never acked.</text>
<text x="94.0" y="1071.0" font-family="Menlo, Consolas, monospace" font-size="12" fill="#F0B3A9">AGENT_DOWN: the heartbeat stops. This gap stays in the audit trail permanently.</text>
<path d="M78 1106.0 H596.7" stroke="#6B5423" stroke-width="1"/>
<path d="M1043.3 1106.0 H1562.0" stroke="#6B5423" stroke-width="1"/>
<text x="820.0" y="1110.0" font-family="Menlo, Consolas, monospace" font-size="12" fill="#D6A548" text-anchor="middle">Pub/Sub redelivers · measured at 8s after the process died</text>
<text x="78.0" y="1146.0" font-family="Menlo, Consolas, monospace" font-size="12" fill="#98A2B0" font-weight="600">attempt 2</text>
<text x="78.0" y="1164.0" font-family="Menlo, Consolas, monospace" font-size="12" fill="#6C7684">worker nrl-958558</text>
<text x="78.0" y="1180.0" font-family="Menlo, Consolas, monospace" font-size="12" fill="#6C7684">a fresh container</text>
<rect x="278.0" y="1130.0" width="340.4" height="40.0" rx="8" fill="#141F2B" stroke="#BBD6F2" stroke-width="1" />
<text x="293.0" y="1155.0" font-family="Menlo, Consolas, monospace" font-size="12" fill="#BBD6F2">1  resolve_provider  SKIPPED — already done</text>
<rect x="630.4" y="1130.0" width="210.5" height="40.0" rx="8" fill="#12271D" stroke="#BFE6D0" stroke-width="1" />
<text x="645.4" y="1155.0" font-family="Menlo, Consolas, monospace" font-size="12" fill="#BFE6D0">2  fhir_appointment  done</text>
<rect x="852.9" y="1130.0" width="196.0" height="40.0" rx="8" fill="#12271D" stroke="#BFE6D0" stroke-width="1" />
<text x="867.9" y="1155.0" font-family="Menlo, Consolas, monospace" font-size="12" fill="#BFE6D0">3  calendar_event  done</text>
<rect x="1060.9" y="1130.0" width="145.5" height="40.0" rx="8" fill="#12271D" stroke="#BFE6D0" stroke-width="1" />
<text x="1075.9" y="1155.0" font-family="Menlo, Consolas, monospace" font-size="12" fill="#BFE6D0">4  confirm  done</text>
<rect x="78.0" y="1196.0" width="1484.0" height="96.0" rx="9" fill="#12271D" stroke="#5FB287" stroke-width="1" />
<text x="96.0" y="1223.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#BFE6D0" font-weight="600">One FHIR Appointment. One calendar event. Never two of either.</text>
<text x="96.0" y="1245.0" font-family="Menlo, Consolas, monospace" font-size="12" fill="#98A2B0">Every step key is {taskId}:{stepName} — identical on every replay. The idempotency key is written INTO each external</text>
<text x="96.0" y="1262.0" font-family="Menlo, Consolas, monospace" font-size="12" fill="#98A2B0">system (FHIR identifier, Calendar iCalUID) and searched for before creating, so the guarantee survives a total loss of</text>
<text x="96.0" y="1279.0" font-family="Menlo, Consolas, monospace" font-size="12" fill="#98A2B0">local state. At-least-once delivery + idempotent steps = effectively-once. There is no exactly-once, and we do not claim it.</text>
<path d="M48 1348.0 H1592.0" stroke="#2A323D" stroke-width="1"/>
<text x="48.0" y="1372.0" font-family="Menlo, Consolas, monospace" font-size="12" fill="#6C7684">Cloud Run · Pub/Sub · Firestore · Cloud Healthcare API (FHIR R4) · Google Calendar API · Gemini 3.5 Flash-Lite + 3.7 Flash · Gemini TTS</text>
<text x="48.0" y="1391.0" font-family="Menlo, Consolas, monospace" font-size="12" fill="#6C7684">Gemma (PHI log audit) · ADK + A2A cards · Cloud Scheduler · Secret Manager</text>
<text x="48.0" y="1410.0" font-family="Menlo, Consolas, monospace" font-size="12" fill="#98A2B0">vitahome.vitamedas.com · Graviti Labs</text>
</svg>
