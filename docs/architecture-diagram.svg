<text x="510.8" y="315.0" font-family="Menlo, Consolas, monospace" font-size="11" fill="#6C7684">care plan</text>
<rect x="425.8" y="330.0" width="385.7" height="62.0" rx="9" fill="#1B222B" stroke="#2A323D" stroke-width="1" />
<text x="441.8" y="356.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#E8EAED" font-weight="600">dispatch</text>
<text x="441.8" y="372.0" font-family="Menlo, Consolas, monospace" font-size="12" fill="#6C7684">writes the task, then publishes with agent=&lt;name&gt;</text>
<path d="M499.8 398.0 V429.0" stroke="#2A323D" stroke-width="1"/>
<path d="M499.8 436.0 l-4.5,-7 h9 z" fill="#2A323D"/>
<text x="510.8" y="421.0" font-family="Menlo, Consolas, monospace" font-size="11" fill="#6C7684">one message</text>
<rect x="78.0" y="436.0" width="1484.0" height="52.0" rx="9" fill="#12271D" stroke="#5FB287" stroke-width="1" />
<text x="96.0" y="468.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#5FB287" font-weight="600">Pub/Sub topic · fleet-work</text>
<text x="1544.0" y="468.0" font-family="Menlo, Consolas, monospace" font-size="12" fill="#98A2B0" text-anchor="end">one topic · six push subscriptions · each filtered on the agent attribute</text>
