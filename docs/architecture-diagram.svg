<text x="94.0" y="570.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#98A2B0">checks</text>
<rect x="327.5" y="512.0" width="236.5" height="78.0" rx="9" fill="#1B222B" stroke="#2A323D" stroke-width="1" />
<path d="M336.5 512.5 H555.0" stroke="#5FB287" stroke-width="2.5" stroke-linecap="round"/>
<text x="343.5" y="538.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#E8EAED" font-weight="600">Scheduler</text>
<text x="343.5" y="554.0" font-family="Menlo, Consolas, monospace" font-size="12" fill="#6C7684">"scheduler"</text>
<text x="343.5" y="570.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#98A2B0">books · own service</text>
<rect x="577.0" y="512.0" width="236.5" height="78.0" rx="9" fill="#1B222B" stroke="#2A323D" stroke-width="1" />
<path d="M586.0 512.5 H804.5" stroke="#D6A548" stroke-width="2.5" stroke-linecap="round"/>
