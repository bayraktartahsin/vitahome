<svg xmlns="http://www.w3.org/2000/svg" width="1640" height="1432" viewBox="0 0 1640 1432">
<rect width="1640" height="1432" fill="#0F1216"/>
<rect x="48.0" y="48.0" width="36.0" height="36.0" rx="9" fill="#5FB287" stroke="#5FB287" stroke-width="1" />
<text x="66.0" y="73.0" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#0F1216" font-weight="600" text-anchor="middle">+</text>
<text x="98.0" y="65.0" font-family="Helvetica, Arial, sans-serif" font-size="29" fill="#E8EAED" font-weight="600">VitaHome — architecture</text>
<text x="98.0" y="85.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#98A2B0">An agent fleet that carries out hospital discharge instructions · Google Cloud</text>
<rect x="48" y="112" width="1544" height="726" rx="14" fill="#161B22" stroke="#2A323D" stroke-width="1"/>
<text x="78.0" y="150.0" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#E8EAED" font-weight="600">How work flows</text>
<text x="78.0" y="178.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#98A2B0">Exactly one synchronous call — the parse, because a person is standing there holding a phone.</text>
<text x="78.0" y="197.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#98A2B0">Everything after it is decoupled: agents address each other by Pub/Sub attribute, never by function call.</text>
<rect x="78.0" y="224.0" width="255.8" height="62.0" rx="9" fill="#1B222B" stroke="#2A323D" stroke-width="1" />
<text x="94.0" y="250.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#E8EAED" font-weight="600">Family surface</text>
<text x="94.0" y="266.0" font-family="Menlo, Consolas, monospace" font-size="12" fill="#6C7684">/capture · Next.js on Cloud Run</text>
<rect x="425.8" y="224.0" width="429.0" height="62.0" rx="9" fill="#1B222B" stroke="#2A323D" stroke-width="1" />
<text x="441.8" y="250.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#E8EAED" font-weight="600">Parser</text>
<text x="441.8" y="266.0" font-family="Menlo, Consolas, monospace" font-size="12" fill="#6C7684">Gemini 3.5 Flash-Lite · ~3s · the only synchronous call</text>
<path d="M333.8 255.0 H418.8" stroke="#2A323D" stroke-width="1"/>
<path d="M425.8 255.0 l-7,-4.5 v9 z" fill="#2A323D"/>
<text x="379.8" y="247.0" font-family="Menlo, Consolas, monospace" font-size="11" fill="#6C7684" text-anchor="middle">photo</text>
